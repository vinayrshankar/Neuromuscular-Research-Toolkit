name: Bug report
description: Report incorrect behavior, crashes, data-handling problems, or numerical concerns.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve NMRT. Please do not upload identifiable participant data, protected health information, or proprietary vendor files.
  - type: input
    id: version
    attributes:
      label: NMRT version
      placeholder: e.g. 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core data model / provenance
        - Import / export
        - QC
        - EMG
        - Force / torque
        - IMU / movement
        - Respiration
        - Audio / voice / cough
        - Spectral / coupling analysis
        - Pipeline / CLI
        - GUI
        - Hardware / acquisition
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: Use synthetic or deidentified data whenever possible. Include sample rate, units, and relevant configuration.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, hardware/vendor software if relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I have not included identifiable participant data, PHI, credentials, or proprietary licensed files.
          required: true
